name: Refresh Materialized Views

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Refresh materialized views
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          psql "$NEON_DATABASE_URL" -c "REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.top_rated_actors;"
          psql "$NEON_DATABASE_URL" -c "REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.top_rated_crew;"
          psql "$NEON_DATABASE_URL" -c "REFRESH MATERIALIZED VIEW CONCURRENTLY analytics.actor_stats;"
