name: Refresh Analytics Views

on:
  schedule:
    - cron: '0 23 * * *' # 23:00 UTC = 02:00 Turkey time (UTC+3)
  workflow_dispatch: # also allows manual trigger from GitHub UI

jobs:
  refresh:
    name: Refresh Neon Materialized Views
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node cache for pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh materialized views
        run: pnpm tsx scripts/screen/utils/update-analytics.ts
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          VIEWS_CRYPT_KEY: ${{ secrets.VIEWS_CRYPT_KEY }}

      - name: Purge Vercel ISR cache
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.REVALIDATE_SECRET }}\"}" \
            https://mehmetyildiz.dev/api/screen/revalidate
        continue-on-error: true # don't fail the workflow if revalidation fails

      # ── Sync Search Index to Cloudflare D1 ────────────────────────────────
      - name: Calculate Search Index Diff
        id: search_diff
        run: |
          pnpm tsx search-worker/scripts/search-diff.ts --remote

          upload_required="$(jq -r '.upload_required' search-worker/d1/search_diff_summary.json)"

          if [[ "$upload_required" != "true" && "$upload_required" != "false" ]]; then
            echo "Invalid upload_required value: $upload_required"
            exit 1
          fi

          echo "upload_required=$upload_required" >> "$GITHUB_OUTPUT"
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Incremental Search Diff to Cloudflare D1
        if: steps.search_diff.outputs.upload_required == 'true'
        run: >
          pnpm exec wrangler d1 execute screen
          --remote
          --config=search-worker/wrangler.toml
          --file=search-worker/d1/search_diff.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report No Search Changes
        if: steps.search_diff.outputs.upload_required == 'false'
        run: echo "Search index is already up to date; no D1 upload needed."

      # ── Sync Slug Details to Cloudflare D1 ────────────────────────────────
      - name: Calculate Slug Details Diff
        id: slug_diff
        run: |
          pnpm tsx search-worker/scripts/slug-diff.ts --remote

          upload_required="$(jq -r '.upload_required' search-worker/d1/slug_diff_summary.json)"

          if [[ "$upload_required" != "true" && "$upload_required" != "false" ]]; then
            echo "Invalid upload_required value: $upload_required"
            exit 1
          fi

          echo "upload_required=$upload_required" >> "$GITHUB_OUTPUT"
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload Incremental Slug Diff to Cloudflare D1
        if: steps.slug_diff.outputs.upload_required == 'true'
        run: >
          pnpm exec wrangler d1 execute screen
          --remote
          --config=search-worker/wrangler.toml
          --file=search-worker/d1/slug_diff.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report No Slug Changes
        if: steps.slug_diff.outputs.upload_required == 'false'
        run: echo "Slug details index is already up to date; no D1 upload needed."

      - name: Save Diff Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-sync-diffs
          if-no-files-found: ignore
          retention-days: 1
          path: |
            search-worker/d1/search_diff.sql
            search-worker/d1/search_diff.db
            search-worker/d1/search_diff_summary.json
            search-worker/d1/slug_diff.sql
            search-worker/d1/slug_diff.db
            search-worker/d1/slug_diff_summary.json
